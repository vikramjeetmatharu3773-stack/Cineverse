      - name: Final Validation
        run: |
          echo "=== FINAL VALIDATION ==="
          
          if [ ! -f "app-debug.apk" ]; then
            echo "❌ APK artifact not found"
            exit 1
          fi
          
          # Comprehensive validation
          echo "📱 APK validation checklist:"
          
          # Check APK size
          APK_SIZE=$(stat -c%s app-debug.apk)
          if [ $APK_SIZE -gt 1000000 ]; then
            echo "✅ APK size > 1MB: $APK_SIZE bytes"
          else
            echo "⚠️  APK size < 1MB: $APK_SIZE bytes"
          fi
          
          # Check file type
          if file app-debug.apk | grep -q "Android package"; then
            echo "✅ APK is valid Android package"
          else
            echo "❌ APK is not valid Android package"
            exit 1
          fi
          
          # Check required files
          if unzip -l app-debug.apk | grep -q "AndroidManifest.xml"; then
            echo "✅ AndroidManifest.xml present"
          else
            echo "❌ AndroidManifest.xml missing"
            exit 1
          fi
          
          if unzip -l app-debug.apk | grep -q "classes.dex"; then
            echo "✅ classes.dex present"
          else
            echo "❌ classes.dex missing"
            exit 1
          fi
          
          if unzip -l app-debug.apk | grep -q "resources.arsc"; then
            echo "✅ resources.arsc present"
          else
            echo "❌ resources.arsc missing"
            exit 1
          fi
          
          # Check package name
          PACKAGE_NAME=$(aapt dump badging app-debug.apk | grep "package:" | awk '{print $2}' | sed 's/name=//;s/"//g')
          echo "Package name found: $PACKAGE_NAME"
          if [ "$PACKAGE_NAME" = "com.cineverse.app" ]; then
            echo "✅ Correct package name: $PACKAGE_NAME"
          else
            echo "❌ Wrong package name: $PACKAGE_NAME"
            exit 1
          fi
          
          # Check version info
          VERSION_NAME=$(aapt dump badging app-debug.apk | grep "versionName:" | awk '{print $2}' | sed 's/versionName=//;s/"//g')
          VERSION_CODE=$(aapt dump badging app-debug.apk | grep "versionCode:" | awk '{print $2}' | sed 's/versionCode=//;s/"//g')
          echo "✅ Version: $VERSION_NAME (code: $VERSION_CODE)"
          
          # Check target SDK
          TARGET_SDK=$(aapt dump badging app-debug.apk | grep "targetSdkVersion:" | awk '{print $2}' | sed 's/targetSdkVersion=//;s/"//g')
          if [ "$TARGET_SDK" = "34" ]; then
            echo "✅ Target SDK: $TARGET_SDK (Android 14)"
          else
            echo "⚠️  Target SDK: $TARGET_SDK"
          fi
          
          echo "✅ All validations passed - APK is ready for installation"
          echo "=== VALIDATION COMPLETE ==="